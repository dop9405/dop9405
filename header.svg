<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 충전될수록 차가운 파랑 → 뜨거운 호박색으로 온도가 오르는 그라데이션 -->
    <linearGradient id="charge" x1="0" x2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="0.55" stop-color="#4cc9f0"/>
      <stop offset="0.88" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-400%" width="120%" height="900%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="tipglow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    /* 이름: 외곽선이 그려진 뒤 살짝 채워짐 */
    .name {
      font-size: 72px; font-weight: 700; letter-spacing: 4px;
      fill: #4cc9f0; fill-opacity: 0;
      stroke: #4cc9f0; stroke-width: 1.4;
      stroke-dasharray: 400; stroke-dashoffset: 400;
      animation: draw 2.4s cubic-bezier(.6,0,.2,1) .2s forwards,
                 fillin 1s ease 2.4s forwards;
    }
    .echo {
      font-size: 72px; font-weight: 700; letter-spacing: 4px;
      fill: none; stroke: #2f6bff; stroke-width: 1; opacity: 0;
      animation: echo 1.2s ease 2.2s forwards;
    }

    /* 진행 바: 빠르게 오르다 끝에서 기어가듯 99%에 멈춤 */
    .bar, .barglow {
      transform-box: fill-box; transform-origin: left center;
      transform: scaleX(0);
      animation: load 3.4s ease-in-out 1s forwards;
    }
    .barglow { opacity: 0; animation: load 3.4s ease-in-out 1s forwards,
                                      pulse 1.4s ease-in-out 4.4s infinite; }

    /* 99%에서 끝이 달아오르며 터지기 직전처럼 맥동 */
    .tip  { opacity: 0; animation: tip 1.4s ease-in-out 4.4s infinite; }
    .ring {
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: ring 1.4s ease-out 4.4s infinite;
    }

    .label { font-size: 15px; fill: #6b7689; letter-spacing: .5px; }
    .pct   { font-size: 15px; font-weight: 600; fill: #9fb3c8; opacity: 0; }
    .p1 { animation: flash .5s linear 1.0s; }
    .p2 { animation: flash .5s linear 1.5s; }
    .p3 { animation: flash .6s linear 2.0s; }
    .p4 { animation: flash .6s linear 2.6s; }
    .p5 { animation: flash .6s linear 3.2s; }
    .p6 { animation: flash .6s linear 3.8s; }
    .p7 { fill: #ffb703; animation: hold .3s linear 4.4s forwards,
                                    hum 1.4s ease-in-out 4.7s infinite; }

    @keyframes draw   { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: .12; } }
    @keyframes echo   { to { opacity: .35; } }
    @keyframes load {
      0%   { transform: scaleX(0); }
      45%  { transform: scaleX(.72); }
      75%  { transform: scaleX(.93); }
      100% { transform: scaleX(1); }
    }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
    @keyframes tip   { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @keyframes ring  {
      0%   { opacity: .8; transform: scale(1); }
      100% { opacity: 0;  transform: scale(4.5); }
    }
    @keyframes flash { from { opacity: 1; } to { opacity: 1; } }
    @keyframes hold  { to { opacity: 1; } }
    @keyframes hum   { 0%,100% { fill: #ffb703; } 50% { fill: #fff4d6; } }

    @media (prefers-reduced-motion: reduce) {
      .name { stroke-dashoffset: 0; fill-opacity: .12; animation: none; }
      .echo { opacity: .35; animation: none; }
      .bar, .barglow { transform: scaleX(1); animation: none; }
      .p7 { opacity: 1; animation: none; }
      .tip { opacity: 1; animation: none; }
      .ring, .p1, .p2, .p3, .p4, .p5, .p6 { animation: none; }
    }
  </style>

  <rect width="800" height="260" rx="14" fill="#0a0f1a"/>

  <!-- 이름 -->
  <text class="echo sans" x="405" y="126" text-anchor="middle">Jeongmin Choi</text>
  <text class="name sans" x="400" y="121" text-anchor="middle">Jeongmin Choi</text>

  <!-- 라벨 + 퍼센트 -->
  <text class="label sans" x="60" y="182">loading potential</text>
  <g class="sans" text-anchor="end">
    <text class="pct p1" x="740" y="182">8%</text>
    <text class="pct p2" x="740" y="182">34%</text>
    <text class="pct p3" x="740" y="182">61%</text>
    <text class="pct p4" x="740" y="182">78%</text>
    <text class="pct p5" x="740" y="182">90%</text>
    <text class="pct p6" x="740" y="182">96%</text>
    <text class="pct p7" x="740" y="182">99%</text>
  </g>

  <!-- 진행 바 (트랙 680px 중 99% = 673.2px) -->
  <rect x="60" y="198" width="680" height="4" rx="2" fill="#1c2433"/>
  <rect class="barglow" x="60" y="196" width="673.2" height="8" rx="4" fill="url(#charge)" filter="url(#blur)"/>
  <rect class="bar" x="60" y="198" width="673.2" height="4" rx="2" fill="url(#charge)"/>

  <!-- 끝점: 달아오르는 코어와 퍼져나가는 링 -->
  <circle class="tip" cx="733.2" cy="200" r="7" fill="#ffb703" filter="url(#tipglow)"/>
  <circle class="tip" cx="733.2" cy="200" r="3" fill="#fff4d6"/>
  <circle class="ring" cx="733.2" cy="200" r="4" fill="none" stroke="#ffb703" stroke-width="1"/>
</svg>
